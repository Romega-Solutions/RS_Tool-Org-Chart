# DDoS-hardened Nginx reverse proxy for Org Chart Generator
# Layer 1: connection limits, request rate limits, body size, timeouts

# Rate limit zones (shared memory)
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=upload:10m rate=5r/m;

# Connection limit per IP
limit_conn_zone $binary_remote_addr zone=connlimit:10m;

server {
    listen 80;
    server_name _;

    # --- Global protections ---

    # Max connections per IP
    limit_conn connlimit 20;

    # Request body size limit (10MB for CSV import, photos are resized server-side)
    client_max_body_size 10m;

    # Slowloris protection: tight timeouts
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 30s;

    # Hide server version
    server_tokens off;

    # Security headers (belt + suspenders with Next.js headers)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Login endpoint: strict rate limit (3 req/min) ---
    location /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://orgchart:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Upload endpoint: moderate rate limit (5 req/min) ---
    location /api/upload {
        limit_req zone=upload burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 5m;
        proxy_pass http://orgchart:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- API endpoints: moderate rate limit (10 req/s) ---
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://orgchart:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Static assets: generous rate limit, caching ---
    location /_next/static/ {
        limit_req zone=general burst=50 nodelay;
        proxy_pass http://orgchart:3000;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1d;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    location /uploads/ {
        limit_req zone=general burst=30 nodelay;
        proxy_pass http://orgchart:3000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # --- All other routes: general rate limit (30 req/s) ---
    location / {
        limit_req zone=general burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://orgchart:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for Next.js HMR in dev)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Block common attack paths
    location ~ /\. {
        deny all;
    }

    location ~ ^/(wp-admin|wp-login|xmlrpc|phpmyadmin|\.env|\.git) {
        return 444;
    }
}
