version: "3.8"
services:
  # Nginx reverse proxy — DDoS Layer 1 (rate limits, connection limits, body size)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      orgchart:
        condition: service_healthy
    restart: unless-stopped

  orgchart:
    build: .
    # No public port — only accessible through Nginx
    expose:
      - "3000"
    environment:
      - SESSION_SECRET=${SESSION_SECRET:-}
      - NEXT_PUBLIC_BASE_PATH=${NEXT_PUBLIC_BASE_PATH:-/org-chart}
      - PUBLIC_APP_ORIGIN=${PUBLIC_APP_ORIGIN:-https://tools.romega-solutions.com}
      - API_KEY=${API_KEY:-}
      - ORGCHART_API_KEY=${ORGCHART_API_KEY:-}
      - CRON_SECRET=${CRON_SECRET:-}
      - SYNC_INTERVAL=${SYNC_INTERVAL:-off}
    volumes:
      - orgchart_data:/app/data
      - orgchart_uploads:/app/public/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000/org-chart/api/auth/me"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Lightweight cron sidecar — reads sync_interval from the app settings
  # and calls GET /api/sync/cron on the configured schedule.
  # Set CRON_SECRET in .env to enable. Disabled when CRON_SECRET is empty.
  sync-cron:
    image: alpine:3.20
    depends_on:
      orgchart:
        condition: service_healthy
    environment:
      - CRON_SECRET=${CRON_SECRET:-}
      - SYNC_INTERVAL=${SYNC_INTERVAL:-off}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        apk add --no-cache curl > /dev/null 2>&1
        if [ -z "$$CRON_SECRET" ]; then
          echo "[sync-cron] CRON_SECRET not set — exiting. Set it in .env to enable auto-sync."
          exit 0
        fi
        case "$$SYNC_INTERVAL" in
          1h)  SLEEP=3600 ;;
          6h)  SLEEP=21600 ;;
          12h) SLEEP=43200 ;;
          24h) SLEEP=86400 ;;
          *)   echo "[sync-cron] SYNC_INTERVAL=$$SYNC_INTERVAL (off) — exiting."; exit 0 ;;
        esac
        echo "[sync-cron] Running every $$SYNC_INTERVAL ($$SLEEP seconds)"
        while true; do
          sleep $$SLEEP
          echo "[sync-cron] Triggering sync..."
          curl -sf -H "Authorization: Bearer $$CRON_SECRET" http://orgchart:3000/api/sync/cron || echo "[sync-cron] Sync request failed"
        done
    restart: unless-stopped

volumes:
  orgchart_data:
  orgchart_uploads:
