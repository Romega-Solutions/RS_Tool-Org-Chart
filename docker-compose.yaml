version: "3.8"
services:
  # Nginx reverse proxy — DDoS Layer 1 (rate limits, connection limits, body size)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      orgchart:
        condition: service_healthy
    restart: unless-stopped

  orgchart:
    build: .
    # No public port — only accessible through Nginx
    expose:
      - "3000"
    environment:
      - SESSION_SECRET=${SESSION_SECRET:-}
      - NEXT_PUBLIC_BASE_PATH=${NEXT_PUBLIC_BASE_PATH:-/org-chart}
      - PUBLIC_APP_ORIGIN=${PUBLIC_APP_ORIGIN:-https://tools.romega-solutions.com}
      - API_KEY=${API_KEY:-}
      - ORGCHART_API_KEY=${ORGCHART_API_KEY:-}
      - DIRECTORY_DATABASE_URL=${DIRECTORY_DATABASE_URL:-}
      - DIRECTORY_SUPABASE_URL=${DIRECTORY_SUPABASE_URL:-}
    volumes:
      - orgchart_data:/app/data
      - orgchart_uploads:/app/public/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000/org-chart/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  orgchart_data:
  orgchart_uploads:
