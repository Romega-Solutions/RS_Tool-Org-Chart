name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Lint, build, and test
    runs-on: ubuntu-latest
    env:
      SESSION_SECRET: ci-only-session-secret-for-build-and-e2e-checks
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install --global pnpm@10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Build application
        run: pnpm build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --browser=chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  deploy:
    name: Deploy to VPS
    needs: ci
    runs-on: ubuntu-latest
    environment: VPS_HOST
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            PROJECT_DIR="/etc/easypanel/projects/romega-projects/rs_tool-org-chart/code"
            echo "=== Deployment Start ==="
            cd "$PROJECT_DIR"
            
            # Use GITHUB_TOKEN passed as an environment variable to authenticate the clone
            # This is the most standard way for GitHub Actions to talk to GitHub
            echo "=== Re-cloning master with AUTH ==="
            sudo rm -rf /tmp/org-chart-master
            sudo git clone --depth=1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Romega-Solutions/RS_Tool-Org-Chart.git /tmp/org-chart-master
            
            echo "=== Copying files ==="
            sudo cp -rf /tmp/org-chart-master/* .
            sudo cp -rf /tmp/org-chart-master/.[!.]* . 2>/dev/null || true
            
            echo "=== Triggering Rebuild ==="
            sudo touch package.json
            
            echo "=== Deployment Success ==="
            date

      - name: Verify live site
        env:
          LIVE_URL: https://romega-projects-rs-tool-org-chart.ikuuwb.easypanel.host
        run: |
          set -euo pipefail

          echo "Checking $LIVE_URL"
          html="$(curl --fail --silent --show-error --location --max-time 30 "$LIVE_URL")"
          echo "$html" | grep -q "<title>Org Chart - Romega Solutions</title>"
          echo "Live site returned expected title."
