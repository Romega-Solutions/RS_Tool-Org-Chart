name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: VPS_HOST
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            echo "=== Syncing Code ==="
            cd /etc/easypanel/projects/romega-projects/rs_tool-org-chart/code
            
            # If no .git, initialize it (needed for first-time or broken setups)
            if [ ! -d ".git" ]; then
              echo "Initializing git repository..."
              git init
              git remote add origin https://github.com/Romega-Solutions/RS_Tool-Org-Chart.git
            fi
            
            git fetch origin master
            git reset --hard origin/master
            
            echo "=== Last Commit ==="
            git log -1 --oneline || echo "Could not log"
            
            echo "=== Triggering Easypanel Rebuild ==="
            # This forces Easypanel to notice the change if it uses a file watcher
            touch package.json
            
            echo "=== Deployment Status ==="
            docker ps --format "table {{.Names}}\t{{.Status}}" | grep "org-chart"
