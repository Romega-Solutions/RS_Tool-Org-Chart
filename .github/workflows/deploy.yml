name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: VPS_HOST
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            echo "=== Syncing Code ==="
            cd /etc/easypanel/projects/romega-projects/rs_tool-org-chart/code
            git fetch origin master
            git reset --hard origin/master
            
            echo "=== Triggering Easypanel Rebuild ==="
            # This is a common Easypanel convention for SSH-based triggers if webhooks aren't set up
            # But since we have direct access to the code folder, we can try to find the docker-compose or just wait for Easypanel's file watcher
            ls -la
            
            echo "=== Last Commit ==="
            git log -1 --oneline
