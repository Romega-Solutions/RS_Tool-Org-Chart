name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: VPS_HOST
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            PROJECT_DIR="/etc/easypanel/projects/romega-projects/rs_tool-org-chart/code"
            echo "=== Deployment Start ==="
            cd "$PROJECT_DIR"
            
            # Use wget to download the archive of the master branch from GitHub
            # This completely bypasses git auth issues for public repos
            echo "=== Downloading master branch archive ==="
            sudo wget https://github.com/Romega-Solutions/RS_Tool-Org-Chart/archive/refs/heads/master.tar.gz -O master.tar.gz
            
            echo "=== Extracting archive ==="
            # Extract and move files to current directory, overwriting existing ones
            sudo tar -xzf master.tar.gz --strip-components=1
            sudo rm master.tar.gz
            
            echo "=== Triggering Easypanel Build ==="
            sudo touch package.json
            
            echo "=== Deployment Success ==="
            date
