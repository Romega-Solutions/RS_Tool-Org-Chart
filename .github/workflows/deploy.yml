name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: VPS_HOST
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            echo "=== Deep Path Search ==="
            find / -maxdepth 5 -name ".git" 2>/dev/null | grep -i "org-chart" || echo "No .git found"
            
            echo "=== Easypanel Projects ==="
            ls -R /etc/easypanel 2>/dev/null | grep -i "org" || echo "No easypanel config found"

            echo "=== Docker Mounts ==="
            docker inspect romega-projects_rs_tool-org-chart.1.g7qe26aldhz9tm5enxrw7pn4l --format '{{ range .Mounts }}{{ .Source }} -> {{ .Destination }}{{ end }}' 2>/dev/null || echo "Could not inspect"
