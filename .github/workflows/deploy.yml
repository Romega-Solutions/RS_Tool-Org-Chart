name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: VPS_HOST
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            PROJECT_DIR="/etc/easypanel/projects/romega-projects/rs_tool-org-chart/code"
            echo "=== Deployment Start ==="
            cd "$PROJECT_DIR"
            
            # Use public URL with git fetch, but need to bypass potential credential prompt
            # Git 2.3+ allows setting terminal prompt to false
            export GIT_TERMINAL_PROMPT=0
            
            # Since sudo was needed for touch, use it for git too
            if [ ! -d ".git" ]; then
              sudo git init
              sudo git remote add origin https://github.com/Romega-Solutions/RS_Tool-Org-Chart.git
            fi
            
            echo "=== Fetching from GitHub ==="
            sudo git fetch --depth=1 origin master
            
            echo "=== Resetting to latest master ==="
            sudo git reset --hard FETCH_HEAD
            
            echo "=== Triggering Easypanel Build ==="
            sudo touch package.json
            
            echo "=== VPS Deployment Log ==="
            sudo git log -1 --oneline
