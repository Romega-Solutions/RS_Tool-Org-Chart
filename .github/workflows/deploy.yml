name: Deploy to VPS

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: VPS_HOST
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            if [ ! -d ~/RS_Tool-Org-Chart ]; then
              git clone https://github.com/Romega-Solutions/RS_Tool-Org-Chart.git ~/RS_Tool-Org-Chart
            fi
            cd ~/RS_Tool-Org-Chart
            git pull origin master
            docker compose up -d --build
