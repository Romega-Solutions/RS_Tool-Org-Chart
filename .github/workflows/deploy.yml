name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: VPS_HOST
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            PROJECT_DIR="/etc/easypanel/projects/romega-projects/rs_tool-org-chart/code"
            echo "=== Deployment Start ==="
            cd "$PROJECT_DIR"
            
            # Use curl to download the zip from the correct public URL structure
            echo "=== Downloading master branch zip ==="
            sudo curl -L https://github.com/Romega-Solutions/RS_Tool-Org-Chart/archive/refs/heads/master.zip -o master.zip
            
            echo "=== Extracting zip ==="
            # Use unzip which is standard on most VPS
            sudo unzip -o master.zip
            
            echo "=== Moving files ==="
            # GitHub zips include a nested folder like project-name-master
            sudo cp -rn RS_Tool-Org-Chart-master/. .
            sudo rm -rf RS_Tool-Org-Chart-master master.zip
            
            echo "=== Triggering Easypanel Build ==="
            sudo touch package.json
            
            echo "=== Deployment Log ==="
            date
