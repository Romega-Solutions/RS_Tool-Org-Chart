name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: VPS_HOST
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            PROJECT_DIR="/etc/easypanel/projects/romega-projects/rs_tool-org-chart/code"
            echo "=== Deployment Start ==="
            cd "$PROJECT_DIR"
            
            # Use a protocol that doesn't prompt for auth on public repos
            # Or use a dummy credential helper
            sudo git config --global credential.helper store
            echo "https://nobody:password@github.com" | sudo tee ~/.git-credentials > /dev/null
            
            if [ ! -d ".git" ]; then
              sudo git init
              sudo git remote add origin https://github.com/Romega-Solutions/RS_Tool-Org-Chart.git
            fi
            
            echo "=== Fetching from GitHub ==="
            # Use explicit URL to bypass local remote config issues
            sudo git fetch --depth=1 https://github.com/Romega-Solutions/RS_Tool-Org-Chart.git master
            
            echo "=== Resetting to latest master ==="
            sudo git reset --hard FETCH_HEAD
            
            echo "=== Triggering Easypanel Build ==="
            sudo touch package.json
            
            echo "=== VPS Deployment Log ==="
            sudo git log -1 --oneline
