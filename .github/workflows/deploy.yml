name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: VPS_HOST
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            echo "=== User & Home ==="
            whoami
            pwd
            
            echo "=== Searching for project folder ==="
            # Search in home and common locations
            find ~ /var/www /opt /etc/easypanel -maxdepth 4 -name ".git" 2>/dev/null | xargs -I {} dirname {} | grep -i "org-chart" || echo "No .git folders found with 'org-chart'"
            
            echo "=== Searching for Docker Compose ==="
            find / -maxdepth 5 -name "docker-compose.yaml" -path "*org*" 2>/dev/null || echo "No docker-compose.yaml found"

            echo "=== Docker Status ==="
            docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
