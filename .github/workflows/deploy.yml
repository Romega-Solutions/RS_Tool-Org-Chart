name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: VPS_HOST
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            PROJECT_DIR="/etc/easypanel/projects/romega-projects/rs_tool-org-chart/code"
            echo "=== Syncing Code (No Auth) ==="
            cd "$PROJECT_DIR"
            
            if [ ! -d ".git" ]; then
              sudo git init
              sudo git remote add origin https://github.com/Romega-Solutions/RS_Tool-Org-Chart.git
            fi
            
            sudo git fetch origin master --depth=1
            sudo git reset --hard FETCH_HEAD
            
            echo "=== Triggering Rebuild ==="
            sudo touch package.json
            
            echo "=== Latest Commit on VPS ==="
            sudo git log -1 --oneline
