name: Deploy to VPS

on:
  push:
    branches: [master]
    paths-ignore:
      - README.md
      - TODO.md
      - docs/**
      - n8n-workflows/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Lint, build, and test
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --disable-warning=DEP0040
      SESSION_SECRET: ci-only-session-secret-for-build-and-e2e-checks
      # Read-only Employee Portal directory (staging) for the chart e2e tests.
      DIRECTORY_DATABASE_URL: ${{ secrets.DIRECTORY_DATABASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install --global pnpm@10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Build application
        run: pnpm build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --browser=chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  deploy:
    name: Deploy to VPS
    needs: ci
    runs-on: ubuntu-latest
    environment: VPS_HOST
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            PROJECT_DIR="/etc/easypanel/projects/romega-projects/rs_tool-org-chart/code"
            echo "=== Deployment Start ==="
            cd "$PROJECT_DIR"
            
            # Use the built-in GitHub Actions token to authenticate the clone.
            echo "=== Re-cloning master with AUTH ==="
            sudo rm -rf /tmp/org-chart-master
            sudo git clone --depth=1 https://x-access-token:${{ github.token }}@github.com/Romega-Solutions/RS_Tool-Org-Chart.git /tmp/org-chart-master
            
            echo "=== Copying files ==="
            sudo cp -rf /tmp/org-chart-master/* .
            sudo cp -rf /tmp/org-chart-master/.[!.]* . 2>/dev/null || true
            
            echo "=== Marking Easypanel source dirty ==="
            sudo touch package.json
            
            echo "=== Source Sync Complete ==="
            date

      - name: Trigger Easypanel deployment
        env:
          EASYPANEL_DEPLOY_WEBHOOK: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK }}
        run: |
          set -euo pipefail

          if [ -z "${EASYPANEL_DEPLOY_WEBHOOK:-}" ]; then
            echo "::error::Set EASYPANEL_DEPLOY_WEBHOOK in the VPS_HOST environment. The SSH copy step syncs source files, but Easypanel must still rebuild/redeploy the running app."
            exit 1
          fi

          if curl --fail --silent --show-error --location --max-time 60 "$EASYPANEL_DEPLOY_WEBHOOK" >/dev/null; then
            echo "Easypanel deployment webhook triggered."
          else
            echo "::warning::Easypanel webhook failed. Continuing because the next step builds the synced source and forces the active Swarm service refresh."
          fi
          sleep 90

      - name: Force active Swarm service refresh
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          command_timeout: 20m
          script: |
            set -euo pipefail

            PROJECT_DIR="/etc/easypanel/projects/romega-projects/rs_tool-org-chart/code"
            SERVICE_NAME="romega-projects_rs_tool-org-chart"
            IMAGE_TAG="easypanel/romega-projects/rs_tool-org-chart:latest"

            echo "=== Verifying active service ==="
            if ! sudo docker service inspect "$SERVICE_NAME" >/dev/null 2>&1; then
              echo "Service $SERVICE_NAME was not found; leaving Easypanel webhook deployment as the only deployment path."
              exit 0
            fi

            echo "=== Building refreshed image from synced source ==="
            cd "$PROJECT_DIR"
            sudo docker build --pull -t "$IMAGE_TAG" .

            echo "=== Forcing Swarm service to refreshed image ==="
            sudo docker service update --force --image "$IMAGE_TAG" "$SERVICE_NAME"

            echo "=== Waiting for service convergence ==="
            for attempt in $(seq 1 40); do
              replicas="$(sudo docker service ls --filter "name=$SERVICE_NAME" --format '{{.Replicas}}' | head -1)"
              echo "Attempt $attempt/40 replicas=$replicas"
              if [ "$replicas" = "1/1" ]; then
                break
              fi
              if [ "$attempt" = "40" ]; then
                echo "Service did not converge to 1/1."
                sudo docker service ps --no-trunc "$SERVICE_NAME" || true
                exit 1
              fi
              sleep 10
            done

            echo "=== Probing service task locally ==="
            task_container="$(sudo docker ps --filter "name=$SERVICE_NAME" --format '{{.Names}}' | head -1)"
            if [ -z "$task_container" ]; then
              echo "No running task container found for $SERVICE_NAME."
              sudo docker service ps --no-trunc "$SERVICE_NAME" || true
              exit 1
            fi

            sudo docker exec "$task_container" sh -lc 'wget -S -O - http://127.0.0.1:${PORT:-80}/org-chart/api/health 2>&1 | head -80'
            sudo docker exec "$task_container" sh -lc 'wget -S -O - http://127.0.0.1:${PORT:-80}/email-signature/api/health 2>&1 | head -80'

      - name: Verify live site
        env:
          LIVE_URL: https://tools.romega-solutions.com
        run: |
          set -euo pipefail

          echo "Checking $LIVE_URL/org-chart/login"
          html=""
          for attempt in $(seq 1 20); do
            if html="$(curl --fail --silent --show-error --location --max-time 30 "$LIVE_URL/org-chart/login")"; then
              if echo "$html" | grep -q "<title>Org Chart - Romega Solutions</title>"; then
                echo "Live site returned expected title on attempt $attempt."
                break
              fi
              echo "Live site responded but title was not ready yet. Attempt $attempt/20."
            else
              echo "Live site not ready yet. Attempt $attempt/20."
            fi

            if [ "$attempt" = "20" ]; then
              echo "::error::Live site did not return the expected title after waiting."
              exit 1
            fi

            sleep 15
          done

          account_status="$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" --max-time 30 "$LIVE_URL/org-chart/account")"
          if [ "$account_status" != "200" ] && [ "$account_status" != "307" ] && [ "$account_status" != "308" ]; then
            echo "::error::Expected /org-chart/account to be available or redirect to login, got HTTP $account_status"
            exit 1
          fi

          tools_home_status="$(curl --silent --show-error --location --output /dev/null --write-out "%{http_code}" --max-time 30 "$LIVE_URL/")"
          if [ "$tools_home_status" != "200" ]; then
            echo "::error::Expected tools-domain root to resolve to the tools directory, got HTTP $tools_home_status"
            exit 1
          fi

          change_password_status="$(
            curl --silent --show-error --output /dev/null --write-out "%{http_code}" --max-time 30 \
              -X POST "$LIVE_URL/org-chart/api/auth/change-password" \
              -H "Origin: $LIVE_URL" \
              -H "Content-Type: application/json" \
              --data '{"currentPassword":"x","newPassword":"y"}'
          )"
          if [ "$change_password_status" != "401" ]; then
            echo "::error::Expected /org-chart/api/auth/change-password to exist and reject anonymous requests with 401, got HTTP $change_password_status"
            exit 1
          fi

          email_signature_body="$(mktemp)"
          email_signature_status="$(
            curl --silent --show-error --location --output "$email_signature_body" --write-out "%{http_code}" --max-time 30 \
              "$LIVE_URL/email-signature/api/health"
          )"
          if [ "$email_signature_status" != "200" ]; then
            echo "::error::Expected /email-signature/api/health to resolve through the tools-domain handoff, got HTTP $email_signature_status"
            cat "$email_signature_body"
            exit 1
          fi

          if ! grep -q '"service":"email-signature"' "$email_signature_body"; then
            echo "::error::Expected Email Signature health payload from /email-signature/api/health."
            cat "$email_signature_body"
            exit 1
          fi

          echo "Live deep-route verification passed."

      - name: Collect VPS diagnostics on deploy failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          command_timeout: 2m
          script: |
            PROJECT_DIR="/etc/easypanel/projects/romega-projects/rs_tool-org-chart/code"
            echo "=== VPS diagnostics ==="
            date
            cd "$PROJECT_DIR" || exit 0
            echo "=== Git source head ==="
            sudo git -C /tmp/org-chart-master rev-parse --short HEAD 2>/dev/null || true
            echo "=== Docker containers matching org chart ==="
            sudo docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}' | grep -Ei 'org|chart|romega|easy|nginx' || true
            echo "=== Docker services matching org chart ==="
            sudo docker service ls --format 'table {{.Name}}\t{{.Image}}\t{{.Replicas}}\t{{.Ports}}' | grep -Ei 'org|chart|romega|easy|nginx' || true
            echo "=== Docker service tasks matching org chart ==="
            for service in $(sudo docker service ls --format '{{.Name}}' | grep -Ei 'org|chart|rs_tool' || true); do
              echo "--- service: $service ---"
              sudo docker service ps --no-trunc "$service" || true
              sudo docker service logs --tail=160 "$service" || true
            done
            echo "=== Running org chart container logs and probes ==="
            for container in $(sudo docker ps --format '{{.Names}}' | grep -Ei 'org|chart|rs_tool' || true); do
              echo "--- container: $container ---"
              sudo docker inspect \
                --format='status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} image={{.Config.Image}} started={{.State.StartedAt}}' \
                "$container" || true
              sudo docker logs --tail=200 "$container" || true
              sudo docker exec "$container" sh -lc 'echo "--- env names ---"; env | cut -d= -f1 | sort | grep -E "^(NODE_ENV|PORT|HOSTNAME|NEXT_PUBLIC_BASE_PATH|PUBLIC_APP_ORIGIN|SESSION_SECRET|API_KEY|ORGCHART_API_KEY|DIRECTORY_DATABASE_URL|DIRECTORY_SUPABASE_URL)$" || true' || true
              sudo docker exec "$container" sh -lc 'app_port="${PORT:-3000}"; echo "--- local health on port ${app_port} ---"; wget -S -O - "http://127.0.0.1:${app_port}/org-chart/api/health" 2>&1 | head -80' || true
              sudo docker exec "$container" sh -lc 'app_port="${PORT:-3000}"; echo "--- local login on port ${app_port} ---"; wget -S -O - "http://127.0.0.1:${app_port}/org-chart/login" 2>&1 | head -80' || true
              sudo docker exec "$container" sh -lc 'echo "--- fallback health on port 3000 ---"; wget -S -O - http://127.0.0.1:3000/org-chart/api/health 2>&1 | head -40' || true
            done
            echo "=== Docker compose ps ==="
            sudo docker compose ps || true
            echo "=== Recent orgchart logs ==="
            sudo docker compose logs --tail=120 orgchart 2>/dev/null || true
            echo "=== Recent nginx logs ==="
            sudo docker compose logs --tail=80 nginx 2>/dev/null || true
            echo "=== Local container probes ==="
            sudo docker compose exec -T orgchart wget -S -O - http://localhost:3000/org-chart/api/health 2>&1 || true
            sudo docker compose exec -T orgchart wget -S -O - http://localhost:3000/org-chart/login 2>&1 | head -80 || true
